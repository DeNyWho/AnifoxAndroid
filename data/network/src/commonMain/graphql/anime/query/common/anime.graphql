query Anime($url: String!, $userId: String) {
  anime(url: $url) {
    id
    url
    title
    titlesEnglish
    titlesJapan
    titlesOther
    titlesSynonyms
    image {
      large
      medium
      cover
    }
    type
    status
    rating
    ratingCount
    ratingMpa
    minimalAge
    year
    season
    episodesCount
    episodesAired
    duration
    nextEpisode
    releasedOn
    airedOn
    description
    accentColor
    playerLink
    createdAt
    updatedAt
  }
}